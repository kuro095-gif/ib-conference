<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 전남 IB 콘퍼런스</title>
<meta name="description" content="2026 전남 IB 콘퍼런스 · AI 시대, 더 빛날 IB의 교육 가치 · 참가 신청과 강의자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --navy:#0F2557; --blue:#1E4FD8; --blue-soft:#9DB2E0; --sky:#F3F7FF; --sky2:#EAF1FF; --sky3:#F7FAFF;
  --line:#D9E3F7; --line2:#E3EBFA; --ink:#1B2333; --ink2:#39445A; --muted:#5A6478; --white:#FFFFFF;
  --warn-bg:#FFF1D6; --warn-ink:#7A4A00; --warn-line:#F1C27D; --red:#B4380F; --red-bg:#FFE8E0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--white);line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--blue)} a:hover{color:var(--navy)}
button,input,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #7FA3F0;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.narrow{max-width:860px;margin:0 auto;padding:40px 20px 80px;display:flex;flex-direction:column;gap:20px}
.page-bg{background:var(--sky);min-height:70vh}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--blue)}
h1.page{margin:4px 0 0;font-size:30px;font-weight:900;color:var(--navy)}
h2.sec{margin:4px 0 20px;font-size:30px;font-weight:900;color:var(--navy)}
.muted{color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:12px 24px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;border:1px solid var(--blue);background:var(--blue);color:var(--white)}
.btn:hover{background:#1A45BE;color:var(--white)}
.btn.ghost{background:var(--white);color:var(--blue)}
.btn.ghost:hover{background:var(--sky2);color:var(--navy)}
.btn.danger{background:var(--white);color:var(--red);border-color:#E8B4A2}
.btn.danger.solid{background:var(--red);color:var(--white);border-color:var(--red)}
.btn:disabled{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--white)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;padding:8px;min-height:44px;font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.lv-초{background:#E0F2FE;color:#075985}.lv-중{background:#DBEAFE;color:#1E40AF}.lv-고{background:#E0E7FF;color:#312E81}
.lv-공통{background:#EEF2F8;color:#334155}.lv-연구회·IBEC{background:#DDF4F7;color:#155E75}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-weight:700;font-size:15px}
.req{color:#C2410C}
.input{font-size:16px;padding:12px 14px;border:1px solid #C9D7F2;border-radius:10px;min-height:46px;width:100%;background:var(--white);color:var(--ink)}
.input:read-only{background:#F1F4FA;color:var(--ink2)}
textarea.input{resize:vertical;min-height:110px}
.hint{font-size:13px;color:var(--muted)}
.banner{border-radius:14px;padding:14px 18px;font-size:15px;font-weight:500;border:1px solid}
.b-open{background:var(--sky2);color:var(--navy);border-color:#C9D7F2}
.b-late{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.b-closed,.b-before{background:#EEF2F8;color:var(--ink2);border-color:#D5DAE3}
.err{background:#FFF0EC;color:#8A2A0A;border:1px solid #F3C2B2;border-radius:12px;padding:12px 16px;font-size:15px}
.dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;font-size:15px}
.dl dt{font-weight:700;color:var(--blue)} .dl dd{margin:0}

/* 상단 바 (스크롤해도 고정) */
.top{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
.brand img{height:30px;width:auto;display:block}
.brand span{font-weight:700;font-size:16px}
.brand img + span{border-left:1px solid var(--line);padding-left:12px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:15px}
.nav a{color:var(--ink);text-decoration:none;padding:10px 12px;border-bottom:2px solid transparent}
.nav a.on{color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}

/* 메인 */
.hero{background:var(--sky);border-bottom:1px solid var(--line2)}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:48px;padding-top:56px;padding-bottom:64px}
.hero-text{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pill{align-self:flex-start;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px}
.pill.open{background:var(--blue);color:var(--white)} .pill.late{background:var(--warn-bg);color:var(--warn-ink)}
.pill.closed,.pill.before{background:#E6E9EF;color:var(--ink2)}
.hero h1{margin:0;font-size:clamp(34px,5vw,54px);font-weight:900;line-height:1.2;color:var(--navy);letter-spacing:-.02em;word-break:keep-all}
.hero h1 em{font-style:normal;color:var(--blue)}
.facts{margin:6px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;font-size:16px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.facts dt{font-weight:700;color:var(--blue)} .facts dd{margin:0}
.hero-img{flex:1 1 420px;min-width:0}
.frame{background:var(--white);padding:10px;border-radius:24px;box-shadow:0 12px 32px rgba(15,37,87,.14);border:1px solid var(--line);position:relative}
.frame .ph{position:relative;border-radius:16px;overflow:hidden}
.frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.frame .tint{position:absolute;inset:0;pointer-events:none}
.tone-blue .tint{background:rgba(30,79,216,.18);mix-blend-mode:multiply}
.tone-mono img{filter:grayscale(1) contrast(1.05)}
.tone-mono .tint{background:#1E4FD8;mix-blend-mode:color;opacity:.55}
.sched{list-style:none;margin:0;padding:0;border-top:2px solid var(--navy)}
.sched li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:16px 4px;border-bottom:1px solid var(--line2)}
.sched li.key{background:var(--sky)}
.sched .t{flex:0 0 130px;font-weight:700;color:var(--blue)}
.sched .c{flex:1 1 300px;min-width:0}
.sched .rest{color:var(--muted)}
.spk{display:flex;align-items:center;gap:16px}
.avatar{flex:0 0 60px;width:60px;height:60px;border-radius:50%;border:3px solid var(--blue);background:#DCE7FD;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);font-size:20px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{font-size:14px;font-weight:700;padding:9px 16px;min-height:44px;border-radius:999px;border:1px solid #C9D7F2;background:var(--white);color:var(--blue)}
.filters button.on{background:var(--blue);border-color:var(--blue);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pcard > button{display:block;width:100%;text-align:left;color:inherit;background:var(--white);border:0;padding:20px}
.pcard .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.pcard .code{font-weight:900;color:var(--blue)}
.pcard .time{font-size:13px;color:var(--muted)}
.pcard .ttl{display:block;font-size:17px;font-weight:700;line-height:1.5;color:var(--navy)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.pcard .tog{color:var(--blue);font-weight:700;white-space:nowrap}
.pcard .more{border-top:1px solid var(--line2);background:var(--sky3);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.notice{list-style:none;margin:0;padding:0;border-top:2px solid var(--navy)}
.notice li{padding:18px 4px;border-bottom:1px solid var(--line2)}
.notice li.imp{background:var(--sky)}
.notice .h{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;color:var(--navy)}
.notice .d{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.notice .b{margin:6px 0 0;font-size:15px;color:var(--ink2);white-space:pre-line}
.tag-imp{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--blue);color:var(--white)}
.tag-new{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--red-bg);color:var(--red);font-weight:700}
.section{padding-top:72px;padding-bottom:24px}

/* 신청 */
.howto{background:var(--sky);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink2)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.roles label{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:46px;border-radius:10px;border:1px solid #C9D7F2;background:var(--white);cursor:pointer;font-size:15px}
.roles label.on{border-color:var(--blue);background:var(--sky2);font-weight:700;color:var(--navy)}
.roles input,.alt input,.consent input{accent-color:var(--blue);width:18px;height:18px;margin:0}
.slot{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.slot .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--navy);color:var(--white)}
.slot .hd.soft{background:var(--sky2);color:var(--navy)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:inherit;padding:14px 16px;min-height:62px;border:0;border-top:1px solid var(--line2);background:var(--white)}
.row:first-child{border-top:0}
.row.on{background:var(--sky)}
.row:disabled{opacity:.45}
.rank{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;border:2px solid #C9D7F2;color:var(--white);background:var(--white)}
.row.on .rank{background:var(--blue);border-color:var(--blue)}
.box{flex:0 0 32px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid var(--blue);color:var(--white);background:var(--white)}
.row.on .box{background:var(--blue)}
.row .main{flex:1 1 auto;min-width:0}
.row .l1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .l1 strong{color:var(--blue)}
.row .l1 .tt{font-weight:700;color:var(--navy)}
.row .l2{display:block;font-size:14px;color:var(--muted)}
.slot .ft{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:var(--sky3);border-top:1px solid var(--line2);font-size:14px}
.full-wrap{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.full-wrap.on{border-color:var(--blue)}
.alts{border:1px solid var(--warn-line);background:#FFFBF2;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.alt{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:46px;border-radius:10px;cursor:pointer;border:1px solid #F1DDB5;font-size:15px}
.alt.on{background:var(--white);border-color:var(--blue)}
.ask{border:2px solid var(--blue);border-radius:14px;padding:16px 18px;background:var(--white);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.consent{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px}
.terms{margin:0;padding:14px 18px 14px 34px;background:var(--sky3);border-radius:12px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.submit-area{display:flex;flex-direction:column;align-items:center;gap:10px}
.submit-area .btn{min-width:240px;padding:16px 48px;font-size:17px}
.lock{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 28px}
.lock p{margin:0}
.res{background:var(--white);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.resbig{background:var(--navy);color:var(--white);border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;gap:4px}
.resbig .s{color:#C9D5EE;font-size:15px;margin:0}
.mgroup{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mgroup .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.mfile{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 18px;border-top:1px solid #F0F4FC}
.mfile:first-of-type{border-top:0}
.mfile .nm{flex:1 1 240px;min-width:0;word-break:break-all}
.dl-btn{background:var(--sky2);color:var(--blue);text-decoration:none;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;white-space:nowrap}

/* 하단 */
.foot-logos{border-top:1px solid var(--line);background:var(--white)}
.foot-logos .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px;padding-top:40px;padding-bottom:40px}
.foot-logos img{height:104px;width:auto;max-width:100%;display:block;object-fit:contain}
.foot-bar{background:var(--navy);color:#C9D5EE;font-size:14px}
.foot-bar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-top:18px;padding-bottom:18px}
.foot-bar strong{color:var(--white)}
.loading{padding:120px 20px;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .hero .wrap{gap:28px;padding-top:32px;padding-bottom:40px}
  .card{padding:20px}
  .sched .t{flex-basis:100%}
  .foot-logos img{height:80px}
  .brand span{font-size:15px}
  .nav a{padding:8px 9px;font-size:14px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" id="brand"><span>2026 전남 IB 콘퍼런스</span></a>
    <nav class="nav" aria-label="주요 메뉴" id="nav"></nav>
  </div>
</header>
<main id="app" aria-live="polite"><div class="loading">불러오는 중입니다…</div></main>
<footer id="foot"></footer>
<noscript><p style="padding:20px">이 사이트는 자바스크립트가 필요합니다.</p></noscript>

<script>
/* ============================================================
 * 2026 전남 IB 콘퍼런스 · 화면 (GitHub Pages)
 * 아래 API_URL에 Apps Script 웹 앱 주소(…/exec)를 넣으세요.
 * ============================================================ */
var API_URL = 'https://script.google.com/macros/s/AKfycbwwEF4qb5iilUDyY_WQdFnk0Xz1I06rUxDlEHgCwQucQS2Es5pv6DbuHKm5CqpvPDJF/exec';

var LATE = new URLSearchParams(location.search).get('late') || '';
var S = {
  site: null, error: '', route: 'home', query: {},
  home: { filter: '전체', open: {} },
  apply: null,          // 신청 화면 상태
  check: { step: 'lookup', name: '', phone: '', record: null, busy: false, error: '', endText: '' },
  result: { step: 'lookup', name: '', phone: '', data: null, busy: false, error: '' }
};
var CIRCLED = ['①', '②', '③'];
var ROLES = ['교사', '교감', '교장', '교육전문직원'];

/* ---------- 도구 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function imgSrc(id, w) { return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + (w || 1600); }
function imgTag(id, alt, w, extra) {
  return '<img src="' + imgSrc(id, w) + '" data-fid="' + esc(id) + '" data-w="' + (w || 1600) + '" alt="' + esc(alt) + '" ' + (extra || '') + '>';
}
document.addEventListener('error', function (e) {   // 드라이브 이미지 주소가 막히면 다른 주소로 다시 시도
  var t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset.fid && !t.dataset.retry) {
    t.dataset.retry = '1';
    t.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(t.dataset.fid) + '&sz=w' + t.dataset.w;
  }
}, true);
function lv(level) { return '<span class="chip lv-' + esc(level || '공통') + '">' + esc(level || '공통') + '</span>'; }
function daysLeft(iso) { if (!iso) return null; var d = Math.ceil((new Date(iso) - new Date()) / 86400000); return d; }
function sessionsBy(slot) { return (S.site.sessions || []).filter(function (s) { return s.slot === slot; }); }
function findSession(code) { return (S.site.sessions || []).filter(function (s) { return s.code === code; })[0]; }
function whoOf(s) { return [s.org, s.speaker].filter(Boolean).join(' '); }
function fmtSize(n) { if (!n) return ''; if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + 'KB'; return (n / 1048576).toFixed(1) + 'MB'; }
function typeOf(f) {
  var m = f.mime || '', n = (f.name || '').toLowerCase();
  if (/pdf/.test(m) || /\.pdf$/.test(n)) return 'PDF';
  if (/hwp/.test(n)) return '한글';
  if (/presentation|powerpoint/.test(m) || /\.pptx?$/.test(n)) return '발표자료';
  if (/document|word/.test(m) || /\.docx?$/.test(n)) return '문서';
  if (/sheet|excel/.test(m) || /\.xlsx?$/.test(n)) return '표';
  if (/^image\//.test(m)) return '이미지';
  if (/zip/.test(m) || /\.zip$/.test(n)) return '압축';
  return '파일';
}
function isNew(iso, days) { if (!iso) return false; var t = new Date(iso); var n = S.site && S.site.now ? new Date(S.site.now) : new Date(); return (n - t) < days * 86400000 && (n - t) >= -86400000; }

/* ---------- 서버 ---------- */
function apiReady() { return API_URL && API_URL.indexOf('http') === 0; }
function apiGet() {
  return fetch(API_URL + '?action=site&late=' + encodeURIComponent(LATE) + '&t=' + Date.now()).then(function (r) { return r.json(); });
}
function apiPost(action, payload) {
  var body = Object.assign({ action: action, late: LATE }, payload);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })   // text/plain: 사전 확인 요청 없이 전송
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, message: '네트워크 오류입니다. 인터넷 연결을 확인하고 다시 시도해 주세요.' }; });
}

/* ---------- 경로 ---------- */
function parseRoute() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('?');
  var name = parts[0] || 'home';
  var q = {};
  if (parts[1]) parts[1].split('&').forEach(function (kv) { var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
  if (['home', 'apply', 'check', 'result', 'materials'].indexOf(name) < 0) {
    if (name === 'program' || name === 'info') { q.scroll = name; }
    name = 'home';
  }
  S.route = name; S.query = q;
}
window.addEventListener('hashchange', function () { parseRoute(); onRoute(); render(); window.scrollTo(0, 0); afterRender(); });

function onRoute() {
  if (S.route === 'apply') {
    if (!S.apply || S.apply.done) S.apply = newApply();
    if (S.query.pick) preselect(S.query.pick);
  }
}

/* ---------- 상단 바 · 하단 ---------- */
function renderChrome() {
  var site = S.site, cfg = site ? site.config : {};
  var brand = document.getElementById('brand');
  var logo = site && site.images && site.images.headerLogo;

    if (b) b.disabled = miss.length > 0 || S.apply.busy;
  }
  if (k2) { var p = k2.split('.'); S[p[0]][p[1]] = t.value; }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.id === 'applyForm') submitApply();
  if (e.target.id === 'checkForm') submitCheck();
  if (e.target.id === 'resultForm') submitResult();
});
document.addEventListener('change', function (e) {
  var t = e.target, act = t.dataset.act, a = S.apply;
  if (!act || !a) return;
  if (act === 'role') a.role = t.value;
  else if (act === 'alt') a[t.dataset.k] = t.value;
  else if (act === 'consent') a.consent = t.checked;
  else return;
  render();
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  var act = el.dataset.act, v = el.dataset.v, k = el.dataset.k, a = S.apply;
  switch (act) {
    case 'reload': init(); return;
    case 'filter': S.home.filter = v; break;
    case 'card': S.home.open[v] = !S.home.open[v]; break;
    case 'pick': {
      var arr = a[k].slice(), i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < 3) arr.push(v);
      a[k] = arr; break;
    }
    case 'reset': a[k] = []; break;
    case 'full':
      if (a.full === v) { a.full = ''; a.alt1 = ''; a.alt2 = ''; }
      else if (a.s1.length || a.s2.length) a.askFull = v;
      else a.full = v;
      break;
    case 'fullYes': a.full = a.askFull; a.askFull = ''; a.s1 = []; a.s2 = []; break;
    case 'fullNo': a.askFull = ''; break;
    case 'terms': a.terms = !a.terms; break;
    case 'checkReset': S.check = { step: 'lookup', name: '', phone: '', record: null, busy: false, error: '', endText: '' }; break;
    case 'cancelAsk': S.check.step = 'confirm'; break;
    case 'cancelNo': S.check.step = 'found'; break;
    case 'cancelYes': {
      var c = S.check; c.busy = true; render();
      apiPost('cancel', { name: c.name, phone: c.phone }).then(function (res) {
        c.busy = false;
        if (res.ok) c.step = 'cancelled'; else { c.error = res.message; c.step = 'found'; }
        render();
      });
      return;
    }
    case 'edit': {
      var r = S.check.record, n = newApply();
      n.edit = { name: S.check.name, phone: S.check.phone };
      n.org = r.org; n.role = r.role; n.name = r.name; n.phone = r.phoneMasked; n.question = r.question || '';
      if (r.full) { n.full = r.full; n.alt1 = r.alt1; n.alt2 = r.alt2; } else { n.s1 = r.s1.slice(); n.s2 = r.s2.slice(); }
      n.consent = true;
      S.apply = n; location.hash = '#/apply'; return;
    }
    case 'resultReset': S.result = { step: 'lookup', name: '', phone: '', data: null, busy: false, error: '' }; break;
    default: return;
  }
  render();
});

/* ---------- 시작 ---------- */
function init() {
  parseRoute();
  S.error = '';
  render();
  if (!apiReady()) { S.error = '관리자 안내: index.html 맨 아래의 API_URL에 Apps Script 웹 앱 주소를 넣어 주세요.'; render(); return; }
  apiGet().then(function (d) {
    if (!d || !d.ok) { S.error = (d && d.message) || '사이트 정보를 불러오지 못했습니다.'; render(); return; }
    S.site = d; onRoute(); render(); afterRender();
  }).catch(function () { S.error = '사이트 정보를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'; render(); });
}
init();
</script>
</body>
